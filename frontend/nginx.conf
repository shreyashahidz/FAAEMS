server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js carries the one setting (API base URL) that differs between
    # dev and the deployed college server — never cache it aggressively.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # index.html is the one file whose own content is what makes the
    # ?v=N.N cache-busting on app.js/api.js/styles.css actually take
    # effect — those scripts only ever get re-fetched because their <script
    # src> URL in THIS file changed. Without this, a browser holding a
    # cached copy of index.html (e.g. a tab left open, or default
    # heuristic caching with no Cache-Control at all) keeps citing old
    # asset URLs and never sees a deployed update until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
