name: faems

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only reachable by other containers on this network.
    expose:
      - "5432"

  minio:
    # Docker Hub's minio/minio now requires auth for anonymous pulls; quay.io
    # is MinIO's own mirror and stays pullable without a login.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Console (9001) stays internal-only too; only the app needs the S3 API (9000).
    expose:
      - "9000"
      - "9001"
    ports:
      # DEV CONVENIENCE ONLY: exposes the MinIO console on localhost so you can browse
      # uploaded evidence at http://localhost:9001 while developing. Remove this
      # mapping in Phase 14 (on-prem deploy) — object storage must not be reachable
      # from outside the Docker network in production.
      - "127.0.0.1:9001:9001"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      ANALYSIS_USE_LLM: ${ANALYSIS_USE_LLM:-true}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS}
      MFA_ISSUER_NAME: ${MFA_ISSUER_NAME}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES}
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      # 8000 is already taken by another local project on this machine.
      - "127.0.0.1:8010:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn faems.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 4 --timeout 60 --reload"
    # --reload is a dev convenience (picks up code edits without a manual
    # container restart) — drop it for the Phase 14 production deploy.
    # gthread + threads: a browser holds several keep-alive connections open
    # per origin; plain sync workers block one whole worker per connection
    # (even while idle) and gunicorn's timeout watchdog then kills them
    # mid-request, which surfaced as random "Failed to fetch"/500s on the
    # new frontend. Threads let each worker serve multiple connections.

  frontend:
    # Static site (Antigravity-built HTML/CSS/JS), served by nginx — no
    # build step, no Node. Port kept at 5173 so CORS_ALLOWED_ORIGINS in
    # .env (http://localhost:5173) doesn't need to change.
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_logs:
